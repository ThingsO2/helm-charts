# TODO(developer): replace this file with the real API specification of
# helm-charts. What follows is the canonical OpenAPI "Petstore" example, kept
# verbatim so the repository starts with a valid, lintable specification —
# it does NOT describe this service.
#
# This file is created once by Terraform and then ignored: your edits are
# never overwritten, and a later module upgrade will not revert them.
#
# Keep it in sync with the code. standards.md requires openapi.yaml to be a
